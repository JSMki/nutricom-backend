spring.application.name=nutricom

# Los datos de conexion se leen del archivo .env (ver .env.example)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}

# Opcional: dominio del frontend publicado, por ejemplo https://umad-music.vercel.app
app.frontend-url=${FRONTEND_URL:}

spring.web.error.include-message=always

server.port=${PORT:8080}

jwt.secreto=${JWT_SECRET}
jwt.expiracion-horas=${JWT_EXPIRACION_HORAS:8}

app.cors.origenes=${CORS_ORIGENES:http://localhost:*}
